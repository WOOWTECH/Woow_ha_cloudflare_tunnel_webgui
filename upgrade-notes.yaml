# Human-readable declaration required by AGENTS.md. The centralized upgrade
# comparison gate has not yet defined a machine-readable schema for this repo.
addon: cloudflared
from_version: "1.0.4"
to_version: "1.1.0"
breaking_changes:
  - id: run-parameter-allow-list
    affects: schema.run_parameters
    change: >-
      Arbitrary run parameters are no longer accepted. Credential and metrics
      overrides are rejected; only the documented allow-list is supported.
    migration: >-
      Remove unsupported flags before upgrade. Put a manually managed Tunnel
      token in tunnel_token instead of --token or --token-file. Remove --metrics;
      the add-on owns its private metrics listener. Supported flags are
      --edge-bind-address, --edge-ip-version, --grace-period, --ha-connections,
      --logfile, --loglevel, --pidfile, --protocol, --region, --retries and --tag,
      each in --flag=value form.
  - id: metrics-loopback-only
    affects: cloudflared metrics listener on port 36500
    change: >-
      The metrics listener now binds 127.0.0.1:36500 inside the add-on instead
      of listening on all interfaces. A host port mapping no longer exposes it.
    migration: >-
      Use a collector inside the add-on network namespace, or the supported
      GUI/PaaS status API. Do not re-expose credentials via a metrics override.
behavior_changes:
  - id: managed-credential-ownership
    change: >-
      Config cannot replace or remove a PaaS-managed token. Use PaaS connection
      to stop and disconnect first. Pending release blocks configuration writes.
    migration: >-
      To switch to Local or a manual token, complete the disconnect flow before
      saving new configuration. Save any Local route settings you wish to reuse;
      disconnect clears managed credentials and Local route options.
  - id: opt-in-paas-linking
    change: >-
      Existing Local and manual-token installations do not automatically bind
      to PaaS. Linking requires explicit device authorization and a protected,
      active PaaS service with at least one Access seat.
    migration: >-
      Keep using the existing mode, or deliberately remove a manual token
      before following the PaaS connection guide. Subscription, payment, Access
      configuration and final DNS/Access deletion remain in the PaaS Portal.
preserved:
  - Add-on slug, image name, supported architectures and Ingress port 8099.
  - Existing option names and Local/manual-token modes.
  - Existing /data and addon_config storage mappings.
backup_and_rollback:
  - Create a Home Assistant add-on backup before upgrading.
  - >-
    Before restoring a pre-upgrade backup after trying PaaS, stop/disconnect
    the new connector and revoke its PaaS authorization. Confirm the remote
    binding is released; a filesystem restore alone does not release it.
  - >-
    Restore the 1.0.4 add-on backup and prior options. New 1.1.0 PaaS authorization
    state is not supported by 1.0.4. Do not run two connectors with the same
    managed token during rollback.
